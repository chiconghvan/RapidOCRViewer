name: Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
      - '*.*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.1.1) - để trống sẽ đọc từ src/version.h'
        required: false
        type: string
      lang:
        description: 'Ngôn ngữ'
        required: false
        default: 'all'
        type: choice
        options: ['all', 'Chinese', 'English']
  release:
    types: [published]

permissions:
  contents: write

env:
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

jobs:
  # ============================================================
  # Windows: build thật với MSBuild + vcpkg (Tesseract/Leptonica)
  # Tạo: portable zip + 2 installer (zh-CN / en-US)
  # ============================================================
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version4: ${{ steps.version.outputs.version4 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from src/version.h
        id: version
        shell: pwsh
        run: |
          $major = (Select-String -Path src/version.h -Pattern 'VERSION_MAJOR').Line.Split()[2].Trim()
          $minor = (Select-String -Path src/version.h -Pattern 'VERSION_MINOR').Line.Split()[2].Trim()
          $rev   = (Select-String -Path src/version.h -Pattern 'VERSION_REVISION').Line.Split()[2].Trim()
          # Strip any lingering \r (CRLF)
          $major = $major.Trim().Trim("`r","`n")
          $minor = $minor.Trim().Trim("`r","`n")
          $rev   = $rev.Trim().Trim("`r","`n")
          $ver = "$major.$minor.$rev".Trim()
          $ver4 = "$ver.0".Trim()
          if ("${{ inputs.version }}" -ne "") { $ver = "${{ inputs.version }}".Trim(); $ver4 = "$ver.0".Trim() }
          $ver = $ver -replace "`r","" -replace "`n",""
          $ver4 = $ver4 -replace "`r","" -replace "`n",""
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "version4=$ver4" >> $env:GITHUB_OUTPUT
          echo "Version: $ver ($ver4)"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        shell: pwsh
        run: |
          Write-Host "Setting up vcpkg..."
          if (-not $env:VCPKG_ROOT) { $env:VCPKG_ROOT = "C:\vcpkg" }
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          echo "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$env:VCPKG_ROOT\vcpkg.exe" version
          # Install from manifest (vcpkg.json) - uses builtin-baseline SHA
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows --x-manifest-root=. --x-install-root="$env:VCPKG_ROOT\installed"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Manifest install failed, trying direct install..."
            & "$env:VCPKG_ROOT\vcpkg.exe" install tesseract[core]:x64-windows leptonica:x64-windows --triplet x64-windows
            if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
          }
          # Integrate for MSBuild (auto-link Tesseract/Leptonica) - must be after install
          & "$env:VCPKG_ROOT\vcpkg.exe" integrate install
          Write-Host "vcpkg installed:"
          Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\lib" | Select-Object -First 30 | Format-Table Name, Length
          Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\bin" | Select-Object -First 15 | Format-Table Name, Length
          # Verify tesseract lib exists
          if (-not (Test-Path "$env:VCPKG_ROOT\installed\x64-windows\lib\tesseract*.lib")) {
            Write-Host "WARNING: tesseract lib not found, listing libs:"
            Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\lib\*.lib" | Format-Table Name
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Release x64 (HAVE_TESSERACT)
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          if (-not $env:VCPKG_ROOT) { $env:VCPKG_ROOT = "C:\vcpkg" }
          Write-Host "Building with MSBuild (try 1: auto-link via vcpkg integrate)..."
          msbuild vs2026\RapidOCRViewer.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:m
          if ($LASTEXITCODE -eq 0 -and (Test-Path "vs2026\x64\Release\RapidOCRViewer.exe")) {
            Write-Host "Build succeeded on first try"
            Get-ChildItem vs2026\x64\Release | Format-Table Name, Length
            exit 0
          }
          Write-Host "First build failed (likely LNK2019 tesseract), trying explicit link..."
          # Find tesseract/leptonica libs
          $tessLib = Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\lib\tesseract*.lib" | Select-Object -First 1 -ExpandProperty Name
          $leptLib = Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\lib\leptonica*.lib" | Select-Object -First 1 -ExpandProperty Name
          if (-not $tessLib) { $tessLib = "tesseract.lib" }
          if (-not $leptLib) { $leptLib = "leptonica.lib" }
          Write-Host "Using libs: $tessLib $leptLib"
          # Collect all vcpkg libs for fallback
          $allLibs = Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\lib\*.lib" | ForEach-Object { $_.Name } | Join-String -Separator ";"
          Write-Host "All libs: $allLibs"
          # Try with explicit AdditionalDependencies
          msbuild vs2026\RapidOCRViewer.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:m /p:AdditionalDependencies="$tessLib;$leptLib;ComCtl32.lib;shlwapi.lib;%(AdditionalDependencies)"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Second try failed, trying with all libs..."
            msbuild vs2026\RapidOCRViewer.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:m /p:AdditionalDependencies="$allLibs;ComCtl32.lib;shlwapi.lib;"
          }
          if ($LASTEXITCODE -ne 0) { throw "Build failed after fallback" }
          if (-not (Test-Path "vs2026\x64\Release\RapidOCRViewer.exe")) { throw "Exe not found after fallback" }
          Get-ChildItem vs2026\x64\Release | Format-Table Name, Length

      - name: Build Portable
        shell: cmd
        run: |
          call build_portable.bat
          dir dist

      - name: Build Installer (Chinese)
        if: inputs.lang == 'all' || inputs.lang == 'Chinese' || inputs.lang == ''
        shell: cmd
        run: |
          call build_installer.bat Chinese
          dir *.exe

      - name: Build Installer (English)
        if: inputs.lang == 'all' || inputs.lang == 'English'
        shell: cmd
        run: |
          call build_installer.bat English
          dir *.exe

      - name: Rename artifacts with version
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          Write-Host "Version $ver"
          # portable already at dist\RapidOCRViewer-Portable.zip -> rename to versioned
          if (Test-Path "dist\RapidOCRViewer-Portable.zip") {
            Copy-Item "dist\RapidOCRViewer-Portable.zip" "dist\RapidOCRViewer-Portable-$ver-x64.zip" -Force
          }
          # also create lang-suffixed copies for release (same content, different name for consistency)
          if (Test-Path "dist\RapidOCRViewer-Portable.zip") {
            Copy-Item "dist\RapidOCRViewer-Portable.zip" "dist\RapidOCRViewer-Portable-$ver-x64-zh-CN.zip" -Force
            Copy-Item "dist\RapidOCRViewer-Portable.zip" "dist\RapidOCRViewer-Portable-$ver-x64-en-US.zip" -Force
          }
          Get-ChildItem dist | Format-Table Name, Length
          Get-ChildItem RapidOCRViewer-*-Setup.exe | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          retention-days: 7
          path: |
            dist/RapidOCRViewer-Portable*.zip
            dist/RapidOCRViewer-Portable/
            RapidOCRViewer-*-Setup.exe
            vs2026/x64/Release/RapidOCRViewer.exe
            vs2026/x64/Release/*.dll
            vs2026/x64/Release/tessdata/
            redist/*.dll
            tessdata/vie.traineddata

      - name: Upload exe for downstream (macOS/Linux)
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          retention-days: 7
          path: |
            vs2026/x64/Release/RapidOCRViewer.exe
            vs2026/x64/Release/*.dll
            vs2026/x64/Release/tessdata/vie.traineddata
            redist/*.dll
            tessdata/vie.traineddata

  # ============================================================
  # macOS NATIVE: Apple Clang + AppKit + CMake -> .app thật
  # Chạy song song với cross DMG để vẫn có cả 2 loại artifact
  # ============================================================
  build-macos-native:
    runs-on: macos-latest
    needs: build-windows
    outputs:
      version: ${{ needs.build-windows.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: bash
        run: |
          clang --version
          cmake --version
          sw_vers
          xcode-select -p || true

      - name: Install deps (brew)
        shell: bash
        run: |
          brew update
          brew install tesseract leptonica pkg-config create-dmg || brew install tesseract leptonica pkg-config || true
          brew list --versions tesseract leptonica || true
          clang --version
          cmake --version

      - name: Build native .app (Apple Clang)
        shell: bash
        run: |
          set -e
          chmod +x build_macos.sh
          ./build_macos.sh --native
          ls -lh build/macos/RapidOCRViewer.app 2>/dev/null || ls -lh build/macos/Release/RapidOCRViewer.app || true
          ls -lh dist/*.zip dist/*.dmg 2>/dev/null || true

      - name: Upload macOS native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-artifacts
          retention-days: 7
          path: |
            build/macos/RapidOCRViewer.app
            build/macos/Release/RapidOCRViewer.app
            dist/*-macOS.zip
            dist/*-macOS.dmg
            dist/RapidOCRViewer-macOS.zip
            dist/RapidOCRViewer-macOS.dmg

  # ============================================================
  # macOS CROSS: đóng gói DMG bọc Windows exe (Wine) - giữ tương thích cũ
  # ============================================================
  build-macos:
    runs-on: macos-latest
    needs: build-windows
    outputs:
      version: ${{ needs.build-windows.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows exe
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: _win

      - name: Restore exe to expected location
        shell: bash
        run: |
          set -e
          mkdir -p vs2026/x64/Release/tessdata
          mkdir -p redist
          # exe
          if [ -f "_win/RapidOCRViewer.exe" ]; then
            cp -f "_win/RapidOCRViewer.exe" vs2026/x64/Release/RapidOCRViewer.exe
          elif [ -f "_win/vs2026/x64/Release/RapidOCRViewer.exe" ]; then
            cp -f "_win/vs2026/x64/Release/RapidOCRViewer.exe" vs2026/x64/Release/RapidOCRViewer.exe
          else
            find _win -name "RapidOCRViewer.exe" -exec cp -f {} vs2026/x64/Release/RapidOCRViewer.exe \; || true
          fi
          # dlls
          find _win -name "*.dll" -exec cp -f {} vs2026/x64/Release/ \; 2>/dev/null || true
          find _win -name "*.dll" -exec cp -f {} redist/ \; 2>/dev/null || true
          # tessdata
          find _win -name "vie.traineddata" -exec cp -f {} tessdata/vie.traineddata \; 2>/dev/null || true
          find _win -name "vie.traineddata" -exec cp -f {} vs2026/x64/Release/tessdata/vie.traineddata \; 2>/dev/null || true
          mkdir -p vs2026/x64/Release/tessdata
          [ -f "tessdata/vie.traineddata" ] && cp -f tessdata/vie.traineddata vs2026/x64/Release/tessdata/ || true
          ls -lh vs2026/x64/Release/ || true
          ls -lh redist/ || true

      - name: Install macOS deps
        shell: bash
        run: |
          brew update
          brew install mingw-w64 nsis create-dmg || brew install mingw-w64 nsis || true
          which x86_64-w64-mingw32-gcc || echo "mingw not found"
          which makensis || echo "makensis not found"
          which hdiutil && echo "hdiutil ok"

      - name: Build DMG (Chinese + English)
        shell: bash
        run: |
          set -e
          chmod +x build_macos.sh
          # build both langs via --skip-build (reuse Windows exe)
          ./build_macos.sh --cross Chinese --skip-build --dmg
          ./build_macos.sh --cross English --skip-build --dmg
          # also ensure portable zips exist for macOS (reuse)
          ./build_macos.sh --cross Chinese --skip-build --portable || true
          ls -lh dist/ || true
          ls -lh *.dmg 2>/dev/null || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip
            dist/RapidOCRViewer-Portable/

  # ============================================================
  # Linux: đóng gói tar.gz (cross-compile hoặc reuse exe từ Windows)
  # ============================================================
  build-linux:
    runs-on: ubuntu-latest
    needs: build-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows exe
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: _win

      - name: Restore exe to expected location
        shell: bash
        run: |
          set -e
          mkdir -p vs2026/x64/Release/tessdata redist
          find _win -name "RapidOCRViewer.exe" -exec cp -f {} vs2026/x64/Release/RapidOCRViewer.exe \; 2>/dev/null || true
          find _win -name "*.dll" -exec cp -f {} vs2026/x64/Release/ \; 2>/dev/null || true
          find _win -name "*.dll" -exec cp -f {} redist/ \; 2>/dev/null || true
          find _win -name "vie.traineddata" -exec cp -f {} tessdata/vie.traineddata \; 2>/dev/null || true
          find _win -name "vie.traineddata" -exec cp -f {} vs2026/x64/Release/tessdata/vie.traineddata \; 2>/dev/null || true
          [ -f "tessdata/vie.traineddata" ] && mkdir -p vs2026/x64/Release/tessdata && cp -f tessdata/vie.traineddata vs2026/x64/Release/tessdata/ || true
          ls -lh vs2026/x64/Release/ || true
          ls -lh redist/ | head -n 20 || true

      - name: Install Linux deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis zip python3 || true
          x86_64-w64-mingw32-gcc --version || echo "mingw not available"
          makensis -VERSION || echo "makensis not available"

      - name: Build Linux portable
        shell: bash
        run: |
          set -e
          chmod +x build_linux.sh
          ./build_linux.sh Chinese --skip-build --portable
          ./build_linux.sh English --skip-build --portable || true
          ls -lh dist/ || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/RapidOCRViewer-Portable/

  # ============================================================
  # Release: gom tất cả artifacts và push lên GitHub Release
  # Chỉ chạy khi push tag v* (ví dụ v1.1.1)
  # ============================================================
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-macos-native, build-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: List artifacts
        shell: bash
        run: |
          find _artifacts -type f | sort
          ls -R _artifacts | head -n 100

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release_assets
          # Windows
          find _artifacts/windows-artifacts -type f \( -name "*.zip" -o -name "*.exe" \) -exec cp -f {} release_assets/ \; 2>/dev/null || true
          # macOS cross (Wine)
          find _artifacts/macos-artifacts -type f \( -name "*.dmg" -o -name "*.zip" \) -exec cp -f {} release_assets/ \; 2>/dev/null || true
          # macOS native (Apple Clang .app)
          find _artifacts/macos-native-artifacts -type f \( -name "*.dmg" -o -name "*.zip" \) -exec cp -f {} release_assets/ \; 2>/dev/null || true
          # Linux
          find _artifacts/linux-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp -f {} release_assets/ \; 2>/dev/null || true
          # Deduplicate: nếu có nhiều file cùng tên từ nhiều job, giữ 1
          ls -lh release_assets/ || true
          # Tạo checksums
          cd release_assets && sha256sum * > SHA256SUMS.txt || shasum -a 256 * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

