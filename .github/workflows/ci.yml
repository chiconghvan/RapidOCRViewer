name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_ROOT) { $env:VCPKG_ROOT = "C:\vcpkg" }
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          echo "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$env:VCPKG_ROOT\vcpkg.exe" version
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows --x-manifest-root=. --x-install-root="$env:VCPKG_ROOT\installed"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Manifest install failed, trying direct install..."
            & "$env:VCPKG_ROOT\vcpkg.exe" install tesseract[core]:x64-windows leptonica:x64-windows --triplet x64-windows
            if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
          }
          & "$env:VCPKG_ROOT\vcpkg.exe" integrate install
          Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\lib\*.lib" | Select-Object -First 20 | Format-Table Name

      - name: Build Release x64
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          if (-not $env:VCPKG_ROOT) { $env:VCPKG_ROOT = "C:\vcpkg" }
          msbuild vs2026\RapidOCRViewer.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:m
          if ($LASTEXITCODE -eq 0) { exit 0 }
          Write-Host "First build failed, trying explicit tesseract link..."
          $tessLib = Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\lib\tesseract*.lib" | Select-Object -First 1 -ExpandProperty Name
          $leptLib = Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\lib\leptonica*.lib" | Select-Object -First 1 -ExpandProperty Name
          if (-not $tessLib) { $tessLib = "tesseract.lib" }
          if (-not $leptLib) { $leptLib = "leptonica.lib" }
          msbuild vs2026\RapidOCRViewer.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:m /p:AdditionalDependencies="$tessLib;$leptLib;ComCtl32.lib;shlwapi.lib;"
          if ($LASTEXITCODE -ne 0) { throw "Build failed after fallback" }

      - name: Verify portable packaging (no installer)
        shell: cmd
        run: |
          call build_portable.bat
          dir dist
          if not exist dist\RapidOCRViewer-Portable\RapidOCRViewer.exe exit /b 1

  build-macos-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Apple Clang / CMake
        shell: bash
        run: |
          clang --version
          cmake --version
          xcode-select -p || true
          sw_vers

      - name: Install deps (brew)
        shell: bash
        run: |
          brew update
          # tesseract + leptonica cho OCR thật; nếu muốn CI nhanh có thể bỏ và build mock
          brew install tesseract leptonica pkg-config || brew install tesseract leptonica pkg-config
          brew list --versions tesseract leptonica || true
          pkg-config --modversion tesseract 2>/dev/null || echo "pkg-config tesseract not found (fallback brew path sẽ dùng)"
          pkg-config --modversion lept 2>/dev/null || echo "pkg-config lept not found"

      - name: Build native .app (Apple Clang + CMake)
        shell: bash
        run: |
          set -e
          chmod +x build_macos.sh
          ./build_macos.sh --native
          ls -lh build/macos/RapidOCRViewer.app/Contents/MacOS/ 2>/dev/null || ls -lh build/macos/Release/RapidOCRViewer.app/Contents/MacOS/ || true
          test -d build/macos/RapidOCRViewer.app || test -d build/macos/Release/RapidOCRViewer.app
          ls -lh dist/*.zip dist/*.dmg 2>/dev/null || true

      - name: Build native mock (no tesseract) - sanity
        shell: bash
        run: |
          set -e
          cmake -B build/macos-mock -DCMAKE_BUILD_TYPE=Release -DWITH_TESSERACT=OFF
          cmake --build build/macos-mock -j$(sysctl -n hw.ncpu)
          ls -lh build/macos-mock/RapidOCRViewer.app/Contents/MacOS/ || ls -lh build/macos-mock/Release/RapidOCRViewer.app/Contents/MacOS/ || true

      - name: Upload native app
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-app
          retention-days: 7
          path: |
            build/macos/RapidOCRViewer.app
            build/macos/Release/RapidOCRViewer.app
            build/macos-mock/RapidOCRViewer.app
            build/macos-mock/Release/RapidOCRViewer.app
            dist/*.zip
            dist/*.dmg

  package-linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check build_linux.sh syntax
        shell: bash
        run: |
          bash -n build_linux.sh
          chmod +x build_linux.sh
          ./build_linux.sh --help

      - name: Test portable packaging (mock)
        shell: bash
        run: |
          mkdir -p vs2026/x64/Release/tessdata
          [ -f "tessdata/vie.traineddata" ] && cp -f tessdata/vie.traineddata vs2026/x64/Release/tessdata/ || true
          if [ ! -f "vs2026/x64/Release/RapidOCRViewer.exe" ]; then
            echo "fake exe for CI" > vs2026/x64/Release/RapidOCRViewer.exe
          fi
          ./build_linux.sh --skip-build --portable
          ls -lh dist/ || true
          test -d dist/RapidOCRViewer-Portable
          ./build_linux.sh --help

